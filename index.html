<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>菲洛的海洋冒險 Demo v0.9.1</title>
<style>
:root{
  --panel: rgba(9,34,51,.86);
  --edge: #8fd0e4;
  --ink: #eef9ff;
  --muted: #a6cddb;
  --energy: #62d98c;
  --oxygen: #5ad3f0;
  --gold: #ffd84a;
  --danger: #ff8a7a;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none;-webkit-touch-callout:none;background:#06202e;color:var(--ink);
  font-family:"PingFang TC","Noto Sans TC","Microsoft JhengHei","Heiti TC",sans-serif;
  touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
body{position:fixed;inset:0;width:100%}
#game{position:fixed;left:0;top:0;display:block;image-rendering:pixelated;image-rendering:crisp-edges;z-index:0}
.panel{background:var(--panel);border:2px solid var(--edge);border-radius:10px;
  box-shadow:0 0 0 2px rgba(3,18,28,.85),inset 0 0 0 1px rgba(255,255,255,.06)}
.hidden{display:none!important}

#status{position:fixed;z-index:5;top:calc(10px + env(safe-area-inset-top));left:calc(10px + env(safe-area-inset-left));
  padding:8px 12px 8px 8px;display:grid;grid-template-columns:auto 1fr;grid-template-areas:"face st" "inv inv" "buff buff";gap:5px 10px;align-items:center}
#face{grid-area:face;width:54px;height:61px;image-rendering:pixelated;border-radius:8px;
  background:radial-gradient(circle at 50% 62%,#2d7892,#113a50);border:1px solid rgba(143,208,228,.5)}
.st{grid-area:st;display:flex;flex-direction:column;gap:3px;min-width:160px}
.nm{font-size:16px;font-weight:800;letter-spacing:.04em}
.nm span{margin-left:10px;font-weight:700}
.bar{display:flex;align-items:center;gap:6px;font-size:12px}
.bar i{flex:1;min-width:60px;height:8px;background:rgba(255,255,255,.13);border-radius:4px;overflow:hidden}
.bar em{display:block;height:100%;border-radius:4px;transition:width .2s linear}
#eBar{background:var(--energy)} #oBar{background:var(--oxygen)}
.bar.low #oBar{background:var(--danger);animation:blink .6s steps(2) infinite}
.bar .n{min-width:50px;text-align:right;font-variant-numeric:tabular-nums}
.inv{grid-area:inv;display:flex;gap:12px;font-size:13px;padding-left:4px}
.inv b{font-weight:700;margin-left:4px;font-variant-numeric:tabular-nums}
.buff{grid-area:buff;display:flex;gap:10px;font-size:12px;font-weight:800;padding-left:4px}
.buff .y{color:#ffe27a} .buff .c{color:#9be8ff}
.ico{display:inline-block;width:10px;height:10px;margin-right:5px;vertical-align:-1px}
.ico.al{background:#6fd35c;border-radius:50% 50% 30% 30%;box-shadow:0 0 6px #b6ff7a}
.ico.gf{background:radial-gradient(circle at 35% 35%,#fff3b0,#f5c542 50%,#c48a1a);border-radius:50%;box-shadow:0 0 6px #ffd84a}
.ico.ob{background:radial-gradient(circle at 35% 35%,#fff,#6fd0ff 45%,#2a8fcf);border-radius:50%}

#right{position:fixed;z-index:5;top:calc(10px + env(safe-area-inset-top));right:calc(10px + env(safe-area-inset-right));display:flex;gap:8px;align-items:flex-start}
#tasks{padding:8px 12px;min-width:190px}
#tasks h2{margin:0 0 6px;font-size:15px;display:flex;align-items:center;gap:10px}
#mapBtn{margin-left:auto;font:800 12px/1 inherit;color:var(--ink);background:#2a6f95;border:1.5px solid var(--edge);border-radius:6px;padding:5px 9px;cursor:pointer}
#tasks ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:5px;font-size:13px}
#tasks li{display:flex;align-items:center;gap:7px}
#tasks li b{margin-left:auto;padding-left:12px;font-weight:600;font-variant-numeric:tabular-nums}
#tasks s{width:14px;height:14px;border:2px solid var(--muted);border-radius:3px;display:inline-grid;place-items:center;
  font-size:10px;text-decoration:none;color:#08303f;flex:none}
#tasks li.done{color:var(--muted)}
#tasks li.skip{opacity:.45}
#tasks li.done s{background:var(--energy);border-color:var(--energy)}
#tasks li.done s::after{content:"✓";font-weight:900}
#mapbox{padding:6px 6px 5px;text-align:center;font-size:12px;cursor:pointer}
#mini{width:120px;height:75px;image-rendering:pixelated;display:block;border-radius:5px;margin-bottom:4px}

#labels{position:fixed;left:0;top:0;width:0;height:0;z-index:2;pointer-events:none}
.lbl{position:absolute;left:0;top:0;background:var(--panel);border:2px solid var(--edge);border-radius:8px;
  padding:3px 9px;font-size:13px;text-align:center;white-space:nowrap;line-height:1.35;font-weight:700}
.lbl small{display:block;font-size:11px;font-weight:500;color:var(--muted)}
.lbl.sign{background:#4a3526;border-color:#2a1c12;color:#f3e2c3;border-radius:4px;padding:4px 11px;font-size:14px;
  box-shadow:inset 0 2px 0 rgba(255,255,255,.12),0 2px 0 #1c120b}
.float{position:absolute;left:0;top:0;font-weight:800;font-size:13px;white-space:nowrap;
  text-shadow:0 1px 0 #03202c,0 0 4px #03202c;animation:up 1.1s ease-out forwards}
@keyframes up{from{opacity:1}to{opacity:0;margin-top:-26px}}

#dialog{position:fixed;z-index:7;right:calc(10px + env(safe-area-inset-right));top:130px;
  width:min(330px,50vw);display:flex;gap:8px;align-items:center;padding:8px 24px 8px 8px;cursor:pointer}
#dface{width:36px;height:41px;image-rendering:pixelated;flex:none}
.who{font-weight:800;font-size:12px;color:#bfeeff;margin-bottom:1px}
#dtext{margin:0;font-size:14px;line-height:1.5}
#more{position:absolute;right:9px;bottom:6px;font-size:11px;animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:.25}}

#lablogo{position:fixed;z-index:4;left:calc(10px + env(safe-area-inset-left));bottom:calc(14px + env(safe-area-inset-bottom));
  height:100px;width:auto;border-radius:8px;box-shadow:0 0 0 2px rgba(3,18,28,.85),0 2px 8px rgba(0,0,0,.35);pointer-events:none}
body.touch #lablogo{height:54px;bottom:calc(10px + env(safe-area-inset-bottom));border-radius:5px}
#keys{position:fixed;z-index:5;left:98px;bottom:14px;padding:8px 12px;font-size:13px}
#keys h3{margin:0 0 6px;font-size:14px}
#keys div{display:flex;align-items:center;gap:6px;margin:5px 0}
#keys div span{margin-left:6px}
kbd{display:inline-grid;place-items:center;min-width:22px;height:22px;padding:0 5px;border:1.5px solid var(--edge);
  border-radius:4px;background:rgba(255,255,255,.07);font:700 12px/1 inherit}
#tag{position:fixed;z-index:4;right:18px;bottom:14px;text-align:right;pointer-events:none;text-shadow:0 2px 0 #06303f}
#tag b{display:block;font-size:24px;letter-spacing:.08em;color:#dff6ff}
#tag span{font-size:13px;color:var(--muted)}

#banner{position:fixed;z-index:8;left:50%;top:36%;transform:translate(-50%,-50%);text-align:center;pointer-events:none;opacity:0}
#banner.show{animation:banner 3.2s ease forwards}
#banner .t{font-size:clamp(28px,7.5vw,46px);font-weight:900;letter-spacing:.12em;color:#e9fbff;white-space:nowrap;
  text-shadow:0 3px 0 #0a3a4e,0 0 18px rgba(120,220,255,.6)}
#banner svg{display:block;width:78%;margin:2px auto 0}
#banner .s{font-size:14px;color:#cdeef8;margin-top:2px;text-shadow:0 1px 0 #0a3a4e}
@keyframes banner{0%{opacity:0;transform:translate(-50%,-38%)}15%{opacity:1;transform:translate(-50%,-50%)}75%{opacity:1;transform:translate(-50%,-50%)}100%{opacity:0;transform:translate(-50%,-50%)}}
@keyframes bannerFade{0%,80%{opacity:1}100%{opacity:0}}
@media (prefers-reduced-motion:reduce){#banner.show{animation-name:bannerFade}}

#touch{display:none}
body.touch #touch{display:block}
body.touch #keys,body.touch #tag{display:none}
body.touch #dialog{width:min(250px,58vw);padding:7px 22px 7px 10px}
body.touch #dface{display:none}
body.touch #dtext{font-size:13px;line-height:1.45}
#joy{position:fixed;z-index:6;left:calc(18px + env(safe-area-inset-left));bottom:calc(72px + env(safe-area-inset-bottom));
  width:120px;height:120px;border-radius:50%;background:rgba(9,34,51,.55);border:2px solid rgba(143,208,228,.7);touch-action:none}
#knob{position:absolute;left:50%;top:50%;width:50px;height:50px;margin:-25px 0 0 -25px;border-radius:50%;
  background:radial-gradient(circle at 35% 35%,#d8f7ff,#6cc8ea 60%,#2d88b0);box-shadow:0 2px 0 #0b3a50;pointer-events:none}
#btns{position:fixed;z-index:6;right:calc(16px + env(safe-area-inset-right));bottom:calc(72px + env(safe-area-inset-bottom));width:176px;height:132px}
#btns button{position:absolute;border-radius:50%;border:2px solid var(--edge);color:var(--ink);font:800 15px/1.1 inherit;
  touch-action:none;box-shadow:0 3px 0 rgba(3,18,28,.8)}
#btns button:active,#bS.on{filter:brightness(1.3);transform:translateY(2px);box-shadow:0 1px 0 rgba(3,18,28,.8)}
#bE{right:0;bottom:34px;width:80px;height:80px;background:#2f8f55}
#bS{right:90px;bottom:0;width:68px;height:68px;background:#2a6f95}
#bR{position:fixed;z-index:6;left:calc(150px + env(safe-area-inset-left));bottom:calc(109px + env(safe-area-inset-bottom));
  width:46px;height:46px;border-radius:50%;border:2px solid var(--edge);color:var(--ink);font:800 12px/1.1 inherit;
  background:rgba(9,34,51,.85);box-shadow:0 3px 0 rgba(3,18,28,.8);touch-action:manipulation}
#bR:active{filter:brightness(1.3);transform:translateY(2px)}

.ovl{position:fixed;inset:0;z-index:20;display:grid;place-items:center;background:rgba(3,20,30,.6)}
.card{padding:22px 24px;width:min(440px,calc(100% - 28px));max-height:calc(100% - 36px);overflow:auto;text-align:center}
.card h1{margin:0 0 8px;font-size:22px}
.card p{margin:0 0 16px;line-height:1.65;color:#d4eef7;font-size:15px}
.card button{font:800 15px/1 inherit;padding:11px 18px;border-radius:8px;border:2px solid var(--edge);
  background:#2f8f55;color:#fff;margin:4px 5px;cursor:pointer}
.card button.alt{background:transparent}
.card button.tiny{background:transparent;font-size:12px;padding:7px 10px;color:var(--muted);border-color:rgba(143,208,228,.45)}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.maps{display:grid;gap:8px;margin:6px 0 14px}
.mapRow{display:flex!important;gap:10px;align-items:center;text-align:left;width:100%;margin:0!important;padding:8px!important;
  background:rgba(255,255,255,.04)!important;border:2px solid rgba(143,208,228,.35)!important;border-radius:9px!important}
.mapRow canvas{width:88px;height:55px;border-radius:5px;image-rendering:pixelated;flex:none}
.mapRow b{display:block;font-size:15px;margin-bottom:3px}
.mapRow span{font-size:12px;font-weight:600;color:var(--muted)}
.mapRow.cur{border-color:var(--gold)!important}
.mapRow.done span{color:#8ff0a8}
.mapRow:disabled{opacity:.45;cursor:not-allowed}
.growth{display:flex;justify-content:center;gap:4px;margin:4px 0 10px;flex-wrap:wrap}
.growth canvas{width:52px;height:52px;image-rendering:pixelated;border-radius:8px;background:rgba(255,255,255,.05);border:1px solid rgba(143,208,228,.3)}
.growth canvas.on{border-color:var(--gold);background:rgba(255,216,74,.12)}
#flash{position:fixed;inset:0;z-index:9;pointer-events:none;background:radial-gradient(circle,rgba(255,236,150,.55),rgba(255,236,150,0) 70%);opacity:0}
#flash.go{animation:flash 1s ease-out}
@keyframes flash{0%{opacity:1}100%{opacity:0}}

@media (max-width:1000px){#keys,#tag{display:none}}
@media (max-width:640px){
  #status{padding:6px 8px 6px 6px;gap:3px 8px}
  #face{width:40px;height:45px}
  .st{min-width:112px}
  .nm{font-size:14px}
  .bar{font-size:11px;gap:4px}
  .bar i{min-width:34px;height:6px}
  .bar .n{min-width:42px}
  .inv{display:none}
  #tasks{min-width:0;padding:6px 9px}
  #tasks h2{font-size:13px;margin-bottom:4px}
  #tasks ul{font-size:12px;gap:3px}
  #mapbox{display:none}
  .lbl{font-size:12px}
}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="labels"></div>

<div id="status" class="panel">
  <canvas id="face" width="31" height="35"></canvas>
  <div class="st">
    <div class="nm"><b id="lv">LV 1</b><span>菲洛</span></div>
    <div class="bar"><span>能量</span><i><em id="eBar"></em></i><span class="n" id="eTxt">100/100</span></div>
    <div class="bar" id="oWrap"><span>氧氣</span><i><em id="oBar"></em></i><span class="n" id="oTxt">80/100</span></div>
  </div>
  <div class="inv">
    <span><i class="ico gf"></i>飼料<b id="invF">0 / 5</b></span>
    <span><i class="ico al"></i>微藻<b id="invA">0 / 10</b></span>
    <span><i class="ico ob"></i>氧氣泡<b id="invB">0 / 10</b></span>
  </div>
  <div class="buff" id="buff" style="display:none"></div>
</div>

<div id="right">
  <div id="tasks" class="panel">
    <h2>任務目標<button id="mapBtn">地圖</button></h2>
    <ul id="taskList"></ul>
  </div>
  <div id="mapbox" class="panel"><canvas id="mini" width="96" height="60"></canvas><span id="mapName">淺潮海藻區</span></div>
</div>

<div id="dialog" class="panel hidden">
  <canvas id="dface" width="31" height="35"></canvas>
  <div><div class="who">菲洛</div><p id="dtext"></p></div>
  <span id="more">▼</span>

/* ================= 像素繪圖工具 ================= */
function makeSprite(map, pal, flip){
  const h = map.length, w = Math.max(...map.map(r => r.length));
  const c = mk(w, h), g = c.getContext('2d');
  for (let y = 0; y < h; y++) for (let x = 0; x < map[y].length; x++){
    const ch = map[y][x]; if (ch === '.' || !pal[ch]) continue;
    g.fillStyle = pal[ch]; g.fillRect(flip ? w - 1 - x : x, y, 1, 1);
  }
  return c;
}
function pixEllipse(g, cx, cy, rx, ry, color){
  g.fillStyle = color;
  const R = Math.max(1, Math.floor(ry));
  for (let dy = -R; dy <= R; dy++){
    const dx = Math.round(rx * Math.sqrt(Math.max(0, 1 - (dy*dy)/(ry*ry))));
    g.fillRect(Math.round(cx - dx), Math.round(cy + dy), dx*2 + 1, 1);
  }
}
function glow(g, x, y, r, color){

  gr.addColorStop(0, color); gr.addColorStop(1, 'rgba(0,0,0,0)');
  g.fillStyle = gr; g.beginPath(); g.arc(x, y, r, 0, Math.PI*2); g.fill();
}

/* ================= 菲洛：依等級產生角色 ================= */
const PAL_P = {o:'#1f5a7a',b:'#8fdcf2',l:'#d8f7ff',w:'#ffffff',k:'#15223a',p:'#f5a3b8',y:'#ffd84a',a:'#6cc8ea',m:'#b0445e',Y:'#fff6c0'};
function makeFilo(L){
  const s = 1 + (L - 1)*.17;
  const hrx = Math.round(7.5*s), hry = Math.round(5*s), brx = Math.round(4.6*s), bry = Math.max(2, Math.round(2*s));
  const antH = 3 + L, W = hrx*2 + 3, cx = hrx + 1;
  const headCy = antH + hry + 1, bodyCy = headCy + hry + bry - 1, footY = bodyCy + bry + 1, H = footY + 2;
  const G = [...Array(H)].map(() => Array(W).fill('.'));
  const inE = (x, y, ex, ey, rx, ry) => ((x - ex)**2)/(rx*rx) + ((y - ey)**2)/(ry*ry) <= 1;
  const set = (A, x, y, v) => { if (y >= 0 && y < H && x >= 0 && x < W) A[y][x] = v; };
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++)
    if (inE(x, y, cx, headCy, hrx + .35, hry + .35) || inE(x, y, cx, bodyCy, brx + .3, bry + .3)) G[y][x] = 'b';
  for (const sd of [-1, 1]){
    for (let k = 0; k <= (L >= 3 ? 1 : 0); k++){ set(G, cx + sd*(brx + 1 + k), bodyCy - 1, 'b'); set(G, cx + sd*(brx + 1 + k), bodyCy, 'b'); }
    const f = Math.max(2, Math.round(brx*.5));
    for (let yy = footY - 1; yy <= footY; yy++){ set(G, cx + sd*f, yy, 'b'); set(G, cx + sd*(f + 1), yy, 'b'); }
  }
  const O = G.map(r => r.slice());
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++)
    if (G[y][x] === '.' && [[1,0],[-1,0],[0,1],[0,-1]].some(([dx, dy]) => G[y + dy] && G[y + dy][x + dx] === 'b')) O[y][x] = 'o';
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++)
    if (O[y][x] === 'b' && inE(x, y, cx - hrx*.5, headCy - hry*.5, Math.max(1.2, 1.5*s), Math.max(1, .9*s))) O[y][x] = 'l';
  const ex = Math.round(hrx*.42), ey = headCy + Math.round(hry*.1) - 1, eh = L >= 3 ? 3 : 2;
  for (let r = ey; r < ey + eh; r++){ set(O, cx - ex - 1, r, 'k'); set(O, cx - ex, r, 'k'); set(O, cx + ex, r, 'k'); set(O, cx + ex + 1, r, 'k'); }
  set(O, cx - ex - 1, ey, 'w'); set(O, cx + ex, ey, 'w');
  for (const x of [cx - ex - 3, cx - ex - 2, cx + ex + 2, cx + ex + 3]) if (O[ey + eh] && O[ey + eh][x] === 'b') O[ey + eh][x] = 'p';
  const mr = ey + eh + 1;
  if (L >= 3){ set(O, cx - 1, mr, 'm'); set(O, cx + 1, mr, 'm'); set(O, cx, mr + 1, 'm'); } else set(O, cx, mr, 'm');
  const cr = L >= 3 ? 2 : 1;
  for (let dy = -cr; dy <= cr; dy++) for (let dx = -cr; dx <= cr; dx++)
    if (Math.abs(dx) + Math.abs(dy) <= cr && O[bodyCy + dy] && O[bodyCy + dy][cx + dx] === 'b') O[bodyCy + dy][cx + dx] = 'y';
  if (L >= 4) set(O, cx, bodyCy, 'Y');
  for (const sd of [-1, 1]){
    const bx = cx + sd*Math.round(hrx*.38);
    let by = 0; while (by < H && O[by][bx] !== 'o') by++;
    for (let i = 1; i <= antH; i++) set(O, bx + sd*Math.floor(i/3), by - i, 'a');
    const tx = bx + sd*Math.floor(antH/3), ty = by - antH;
    set(O, tx + sd, ty + 1, 'a'); set(O, tx + 2*sd, ty, 'a'); set(O, tx - sd, ty, 'a');
    if (L >= 3){ const mi = Math.floor(antH/2), mx = bx + sd*Math.floor(mi/3); set(O, mx + sd, by - mi, 'a'); set(O, mx + 2*sd, by - mi - 1, 'a'); }
  }
  const c = makeSprite(O.map(r => r.join('')), PAL_P);
  return {c, W, H, cx, headCy, bodyCy, brx, bry, hrx};
}
const FILO = [null, 1, 2, 3, 4, 5].map(L => L && makeFilo(L));

const WL = mk(110, 90), WLc = WL.getContext('2d');
function leaf(c, x, y, dx, dy, len, wd, L){
  for (let s = 0; s <= len; s += .5){
    const half = Math.sin(Math.PI*Math.min(1, s/len))*wd/2 + (s < 1 ? .5 : 0);
    for (let u = -half; u <= half; u += .5){
      const edge = Math.abs(u) > half - .9, rib = Math.abs(u) < .5;
      let col = edge ? '#6fd3f5' : (rib ? '#effcff' : '#c4f1ff');
      if (L >= 4 && s > len*.7) col = edge ? (L >= 5 ? '#f0b030' : '#e2c070') : (L >= 5 ? '#ffe27a' : '#fff0b8');
      c.fillStyle = col; c.fillRect(Math.round(x + dx*s - dy*u), Math.round(y + dy*s + dx*u), 1, 1);
    }
  }
}
function drawWings(g, L, rx, ry, spread, t, moving, alpha){
  WLc.clearRect(0, 0, 110, 90);

    const a0 = L === 1 ? -28 : -62 + 84*i/(L - 1);
    const a = (a0 + Math.sin(t*fl + i*.6)*7)*Math.PI/180;
    const len = 11 + L*1.5 - Math.abs(i - (L - 1)/2)*1.1, wd = 3.8 + L*.4;
    leaf(WLc, ox + sd*spread, oy, sd*Math.cos(a), Math.sin(a), len, wd, L);
  }

  g.drawImage(WL, Math.round(rx - ox), Math.round(ry - oy));
  g.globalAlpha = 1;
}
function portrait(cv, L, withWings){
  const g = cv.getContext('2d'); g.imageSmoothingEnabled = false; g.clearRect(0, 0, cv.width, cv.height);
  const F = FILO[L], x = Math.floor((cv.width - F.W)/2), y = cv.height - F.H - 1;
  if (withWings) drawWings(g, L, x + F.cx, y + F.bodyCy - F.bry, F.brx - 1, 0, false, .9);
  g.drawImage(F.c, x, y);
}

/* ================= 物件像素圖 ================= */
const G_MAP = ["..o...o...o..","...o..o..o...","...ooooooo...","..oLLGGGGGo..",".oLGGGGGGGGo.",".oGkGGGGGkGo.",

const SPR = {
  germ: makeSprite(G_MAP, {o:'#3a1650',G:'#a45bd6',L:'#d6a3f5',k:'#1a0f24',r:'#ff4d6d'}),

  star: makeSprite(STAR, {O:'#e2702e',o:'#f59a45',y:'#ffc26b'}),

  turtle: [0, 1].map(f => { const legs = f ? [".ff.........ff....","..ff.......ff....."] : ["..ff.......ff.....",".ff.........ff...."];
    const pal = {b:'#3f6b3a',S:'#7a9a4a',s:'#a8b865',f:'#6fa08a',h:'#8fb89a',k:'#1a1a1a'};
    return [makeSprite(TURTLE.concat(legs), pal), makeSprite(TURTLE.concat(legs), pal, true)]; }),
  gull: makeSprite(GULL, {k:'#333',w:'#ffffff',y:'#f59a2a',g:'#9aa5b0'}),
  bottle: makeSprite(BOTTLE, {t:'rgba(220,244,255,.85)',L:'#ffffff',r:'#e0443a',c:'#3a7ad0'}),

};
const FISH = {};
for (const [k, c] of Object.entries({Y:'#ffc93c', B:'#5aa9e6', D:'#2c3e50', O:'#ff9a4a', P:'#b890ff'}))
  FISH[k] = [makeSprite(F_MAP, fishPal(c)), makeSprite(F_MAP, fishPal(c), true)];

/* ================= 場景共用元件 ================= */
const DEEP = ['#1f6a52','#3a9a6a','#62c28a'], MID = ['#2b7d45','#58c267','#7fdc7c'], LIGHT = ['#3c9a4c','#7fd46a','#b4ef8a'];
const LEAF = [[2,0],[3,0],[3,-1],[4,-1],[5,-2]];
function drawKelp(g, kp, t, hMax, down){
  const h = hMax === undefined ? kp.h : Math.min(kp.h, hMax), dir = down ? 1 : -1;
  const [c0, c1, c2] = kp.col;
  for (let i = 0; i < h; i++){
    const px = Math.round(kp.x + Math.sin(t*1.1 + kp.ph + i*.09)*(i*.09)), py = Math.round(kp.y + dir*i);
    g.fillStyle = c0; g.fillRect(px - 1, py, 3, 1);
    g.fillStyle = c1; g.fillRect(px, py, 1, 1);
    if (i % 5 === 2 && i > 2 && i < h - 2){
      const side = ((i/5)|0) % 2 ? 1 : -1;
      g.fillStyle = c0; for (const [dx, dy] of LEAF) g.fillRect(px + side*dx, py + (down ? -dy : dy), 1, 1);
      g.fillStyle = c2; g.fillRect(px + side*3, py + (down ? 1 : -1), 1, 1);
    }
  }
  if (h >= kp.h - 1){ g.fillStyle = c2; g.fillRect(Math.round(kp.x + Math.sin(t*1.1 + kp.ph + h*.09)*(h*.09)), Math.round(kp.y + dir*h) - (down ? 0 : 1), 1, 2); }
}
function drawTuft(g, kp, t, hMax){
  const h = hMax === undefined ? kp.h : Math.min(kp.h, hMax);
  for (const [ox, hf, lean] of [[-2,.7,-1],[0,1,0],[2,.8,1]]){
    const bh = Math.round(h*hf);
    for (let i = 0; i < bh; i++){
      g.fillStyle = i >= bh - 2 ? kp.col[2] : (i < bh/2 ? kp.col[0] : kp.col[1]);
      g.fillRect(Math.round(kp.x + ox + lean*i*.3 + Math.sin(t*1.5 + kp.ph + ox)*i*.12), Math.round(kp.y - i), 1, 1);
    }
  }
}
function makeRock(rnd, rx, ry, pal, moss){
  const c = mk(Math.ceil(rx*2 + 3), Math.ceil(ry*2 + 3)), g = c.getContext('2d');
  const cx = rx + 1, cy = ry + 1;
  pixEllipse(g, cx, cy, rx, ry, pal[0]);
  pixEllipse(g, cx - rx*.12, cy - ry*.22, rx*.85, ry*.7, pal[1]);
  pixEllipse(g, cx - rx*.32, cy - ry*.45, rx*.38, ry*.3, pal[2]);
  for (let i = 0; i < rx; i++){
    g.fillStyle = moss[i % moss.length];
    g.fillRect(Math.round(cx + (rnd() - .5)*rx*1.4), Math.round(cy - ry*.6 + rnd()*ry*.5), 1 + (rnd() < .4), 1);
  }

}
function rockDeco(r){ return {y:r.y, d:g => { pixEllipse(g, r.x, r.y, r.rx + 2, 2, 'rgba(20,40,50,.2)'); g.drawImage(r.c, Math.round(r.x - r.rx - 1), Math.round(r.y - r.ry*2 - 2)); }}; }
function makeFinger(rnd, color){
  const c = mk(15, 15), g = c.getContext('2d'), n = 4 + Math.floor(rnd()*3);
  for (let f = 0; f < n; f++){
    const fx = 2 + f*2 + Math.floor(rnd()*2), fh = 5 + Math.floor(rnd()*8), lean = f % 2 ? 1 : -1;
    g.fillStyle = color; for (let i = 0; i < fh; i++) g.fillRect(fx + (i > fh*.55 ? lean : 0), 14 - i, 2, 1);
    g.fillStyle = 'rgba(255,255,255,.4)'; g.fillRect(fx + (fh > 7 ? lean : 0), 14 - fh, 1, 1);
  }
  g.fillStyle = color; g.fillRect(3, 13, 9, 2);
  return c;
}
function makeBranch(rnd, color, h){
  const c = mk(24, h + 2), g = c.getContext('2d');
  const tip = shade(color, 40);
  function br(x, y, len, ang, dpt){
    for (let i = 0; i < len; i++){
      x += Math.cos(ang); y -= Math.sin(ang);
      g.fillStyle = color; g.fillRect(Math.round(x), Math.round(y), dpt < 2 ? 2 : 1, 1);
    }
    g.fillStyle = tip; g.fillRect(Math.round(x), Math.round(y) - 1, 1, 1);
    if (dpt < 3){ br(x, y, len*.7, ang + .45 + rnd()*.2, dpt + 1); br(x, y, len*.7, ang - .45 - rnd()*.2, dpt + 1); }
  }
  br(12, h + 1, h*.34, Math.PI/2, 0);
  return c;
}
function makeTable(rnd, color, w, stack){
  const H = 10 + stack*12, c = mk(w + 4, H), g = c.getContext('2d');
  g.fillStyle = shade(color, -50); g.fillRect(Math.floor(w/2) - 1, 4, 5, H - 4);
  for (let k = 0; k < stack; k++){
    const y = H - 8 - k*12, ww = w/2 - k*2;
    pixEllipse(g, w/2 + 2, y + 1, ww, 3, shade(color, -35));
    pixEllipse(g, w/2 + 2, y, ww, 3, color);
    pixEllipse(g, w/2 + 1, y - 1, ww*.6, 1.2, shade(color, 45));
    for (let i = 0; i < ww; i++){ g.fillStyle = shade(color, 30); g.fillRect(Math.round(w/2 + 2 + (rnd() - .5)*ww*1.6), Math.round(y + (rnd() - .5)*3), 1, 1); }

}
function makeBrain(rnd, color){
  const c = mk(16, 11), g = c.getContext('2d');

  for (let y = 2; y < 9; y += 2) for (let x = 2; x < 15; x++) if (Math.sin(x*.9 + y*1.7) > .2 && ((x - 8)/7)**2 + ((y - 5)/4.5)**2 < .8) g.fillRect(x, y, 1, 1);

}
function makeFan(rnd, color){
  const c = mk(18, 16), g = c.getContext('2d'); g.fillStyle = color;
  for (let a = -1.1; a <= 1.1; a += .22){ for (let r = 0; r < 14; r++){ if (r > 4 && rnd() < .15) continue; g.fillRect(Math.round(9 + Math.sin(a)*r*.7), Math.round(15 - Math.cos(a)*r), 1, 1); } }
  g.fillStyle = shade(color, 40); for (let i = 0; i < 12; i++) g.fillRect(Math.round(9 + (rnd() - .5)*14), Math.round(3 + rnd()*9), 1, 1);

}
function shade(hex, amt){
  const n = parseInt(hex.slice(1), 16), f = v => clamp(v + amt, 0, 255);
  return '#' + [f(n >> 16), f((n >> 8) & 255), f(n & 255)].map(v => v.toString(16).padStart(2, '0')).join('');
}
function drawAnemone(g, x, y, r, base, tip, t){
  pixEllipse(g, x, y + 2, r*.7, r*.35, shade(base, -60));

  for (let i = 0; i < n; i++){
    const a = i/n*Math.PI*2 + Math.sin(t*1.5 + i)*.08;

function taskDefs(){
  return [{k:'feed', label:'吃黃金飼料', need:NEED.feed, group:'food'}, {k:'algae', label:'或 吃微藻', need:NEED.algae, group:'food'},
    {k:'bubble', label:'收集氧氣泡', need:NEED.bubble}, {k:'purify', label:'淨化汙染區', need:NEED.purify}];
}
function taskVal(k, need){
  if (k === 'algae') return Math.min(S.algae, need);
  if (k === 'bubble') return Math.min(S.bubbles, need);
  if (k === 'feed') return Math.min(S.feed, need);
  if (k === 'purify') return Math.min(S.purifyCount, need);
  if (k === 'obs') return Math.min([...S.obsDone].filter(i => !SC.obs[i].optional).length, need);
  if (k === 'arch') return S.archDone ? 1 : 0;
  return 0;
}
let TASKS = [];
function buildTaskList(){
  TASKS = taskDefs();
  $('taskList').innerHTML = TASKS.map((t, i) => `<li id="t${i}"><s></s>${t.label}<b>0 / ${t.need}</b></li>`).join('');
}
function taskDone(t){ return t.group === 'food' ? foodDone() : taskVal(t.k, t.need) >= t.need; }
function othersDone(){ return TASKS.every(t => t.k === 'arch' || taskVal(t.k, t.need) >= t.need); }
function checkWin(){
  if (S.won || !TASKS.every(taskDone)) return;
  S.won = true;
  if (!S.purified){ const Z = S.zone; S.purified = true; Z.prog = 1; S.sprouts.push({x:Z.x, y:Z.y, r:Z.r, t:S.t}); burst(Z.x, Z.y, '#fff6b0', 30);
    for (const b of S.germs) if (b.alive){ b.alive = false; burst(b.x, b.y, '#c98af0', 14); } }
  PROG.cleared[CUR] = true;
  const from = PROG.lv, full = Math.min(5, 1 + PROG.cleared.filter(Boolean).length);
  const algaeOnly = S.feed < NEED.feed, target = algaeOnly ? Math.min(full, ALGAE_ONLY_MAX) : full;
  const capped = algaeOnly && full > ALGAE_ONLY_MAX && target <= from, leveled = from < target;
  if (leveled){ PROG.lv = target; S.grow = {t:1.6, from}; refreshPortraits(); }
  saveProgress();
  const f = $('flash'); f.classList.remove('go'); void f.offsetWidth; f.classList.add('go');
  for (let i = 0; i < 44; i++){ const a = i/44*Math.PI*2; particles.push({x:S.player.x, y:S.player.y - 6, vx:Math.cos(a)*60, vy:Math.sin(a)*60, life:1.2, max:1.2, c:i % 2 ? '#ffe27a' : '#bdf0ff', s:2}); }
  dlg.q = [];
  say([leveled ? `任務完成！菲洛脫殼長大了，升到 LV ${PROG.lv}，翅膀變成 ${PROG.lv} 對！` : capped ? '任務完成！可是只靠微藻，菲洛長不到更大了……' : '任務完成！這一區又恢復乾淨了！'], () => showWin(leveled, from, capped));
}

const keys = new Set(); let purifyHeld = false;
const menuOpen = () => !$('mapMenu').classList.contains('hidden') || !$('overlay').classList.contains('hidden');
addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  if ([' ','arrowup','arrowdown','arrowleft','arrowright'].includes(k) && !menuOpen()) e.preventDefault();
  keys.add(k);
  if (e.repeat) return;
  if (k === 'm'){ if ($('mapMenu').classList.contains('hidden')) openMapMenu(); else closeMapMenu(); return; }
  if (k === 'escape'){ closeMapMenu(); return; }
  if (menuOpen()) return;
  if (k === 'e') interact();
  else if (k === 'r') askRestart();
  else if (k === 'enter') advance();
  else if (k === ' ') purifyHeld = true;
});
addEventListener('keyup', e => { const k = e.key.toLowerCase(); keys.delete(k); if (k === ' ') purifyHeld = false; });
addEventListener('blur', () => { keys.clear(); purifyHeld = false; });
const joyEl = $('joy'), knob = $('knob'), joy = {id:null, x:0, y:0};
function moveJoy(e){
  const r = joyEl.getBoundingClientRect(); let dx = e.clientX - (r.left + r.width/2), dy = e.clientY - (r.top + r.height/2);
  const m = r.width/2 - 18, d = Math.hypot(dx, dy); if (d > m){ dx *= m/d; dy *= m/d; }
  joy.x = dx/m; joy.y = dy/m; knob.style.transform = `translate(${dx}px,${dy}px)`;
}
joyEl.addEventListener('pointerdown', e => { e.preventDefault(); joy.id = e.pointerId; joyEl.setPointerCapture(e.pointerId); moveJoy(e); });
joyEl.addEventListener('pointermove', e => { if (e.pointerId === joy.id) moveJoy(e); });
const endJoy = e => { if (e.pointerId === joy.id){ joy.id = null; joy.x = joy.y = 0; knob.style.transform = ''; } };
joyEl.addEventListener('pointerup', endJoy); joyEl.addEventListener('pointercancel', endJoy);

const bS = $('bS');
bS.addEventListener('pointerdown', e => { e.preventDefault(); purifyHeld = true; bS.classList.add('on'); try { bS.setPointerCapture(e.pointerId); } catch(_){} });
['pointerup','pointercancel','lostpointercapture'].forEach(ev => bS.addEventListener(ev, () => { purifyHeld = false; bS.classList.remove('on'); }));

/* ================= 更新 ================= */
function updateGerms(dt){
  const p = S.player, B = M.bounds, hitR = 10 + lvl()*1.2, auraR = 24 + lvl()*2;
  S.inv = Math.max(0, S.inv - dt);
  S.germs = S.germs.filter(b => b.alive);
  const Z = S.zone, cap = Z.cap + Math.min(2, Math.floor(((Z.r/Z.r0)**2 - 1)/.4));
  if (!S.purified && !S.over && S.germs.length < cap){
    S.germSpawnT -= dt;
    if (S.germSpawnT <= 0){
      S.germSpawnT = 20;
      const b = newGerm(Z.x + (Math.random() - .5)*Z.r*.9, Z.y + (Math.random() - .5)*Z.r*.7); b.alert = .8; S.germs.push(b);
      burst(b.x, b.y, '#c98af0', 10);
      if (!S.respawnWarned && S.kills > 0){ S.respawnWarned = true; say(['汙染區又冒出新的壞細菌了！要把汙染區淨化，才能真正解決問題。']); }
    }
  }
  const live = S.germs.slice();
  for (const b of live){
    if (!b.alive) continue;
    b.stun = Math.max(0, b.stun - dt); b.alert = Math.max(0, b.alert - dt);
    const d = dist(b.x, b.y, p.x, p.y);
    if (S.eat > 0 && d < auraR){ killGerm(b, '#ffe27a'); continue; }
    if (b.state !== 'chase' && d < 85 && !S.over){
      b.state = 'chase'; b.alert = .8;
      if (!S.germWarned){ S.germWarned = true; say(['小心！是壞細菌，它們從汙染區跑出來了，快躲開！']); }
    } else if (b.state === 'chase' && (d > 140 || S.over)) b.state = 'wander';
    let tx, ty, sp;
    if (b.state === 'chase'){ tx = p.x; ty = p.y; sp = M.germSp; }
    else {
      if (!b.tx || dist(b.x, b.y, b.tx, b.ty) < 4){ const a = Math.random()*Math.PI*2, r = Math.random()*38; b.tx = S.zone.x + Math.cos(a)*r*S.zone.r/44; b.ty = S.zone.y + Math.sin(a)*r*.7; }
      tx = b.tx; ty = b.ty; sp = 16;
    }
    if (b.stun > 0) sp = 0;
    const dx = tx - b.x, dy = ty - b.y, dd = Math.hypot(dx, dy) || 1, k = Math.min(1, dt*3);
    b.vx += (dx/dd*sp - b.vx)*k; b.vy += (dy/dd*sp - b.vy)*k;
    for (const o of live) if (o !== b && o.alive){ const od = dist(b.x, b.y, o.x, o.y); if (od < 12 && od > 0){ b.vx += (b.x - o.x)/od*400*dt; b.vy += (b.y - o.y)/od*400*dt; } }
    b.x = clamp(b.x + b.vx*dt, B[0], B[2]); b.y = clamp(b.y + b.vy*dt, B[1], B[3]);
    if (d < hitR + 1 && S.riding && b.stun <= 0 && !S.over){ const nx = (b.x - p.x)/(d || 1), ny = (b.y - p.y)/(d || 1); b.vx = nx*90; b.vy = ny*90; b.stun = 1; continue; }
    if (d < hitR && S.inv <= 0 && S.eat <= 0 && !S.riding && b.stun <= 0 && !S.over && !S.won){
      S.oxygen = Math.max(0, S.oxygen - 10); S.inv = 1.5; b.stun = 1.2;
      const nx = (p.x - b.x)/(d || 1), ny = (p.y - b.y)/(d || 1);
      p.vx = nx*150; p.vy = ny*150; b.vx = -nx*60; b.vy = -ny*60;
      floatText(p.x, p.y - 20, '-10 氧氣', '#ff9aa8'); burst(p.x, p.y, '#c98af0', 10);
      if (!S.hitOnce){ S.hitOnce = true; say(['被壞細菌碰到，氧氣變少了！汙染物被細菌分解時，也會消耗水中的氧氣。']); }
    }
  }
}
function jellyLeave(){

  j.state = 'leaving'; burst(j.x, j.y, '#d8f4ff', 16);
  if (!ONCE.jellyLeave){ ONCE.jellyLeave = true; say(['水母打倒 5 隻壞細菌，累得游走了……地圖上的其他地方會出現一隻新的水母！']); }
}
function spawnJelly(){
  const B = M.bounds, p = S.player, j = S.jelly;
  let x = j.x, y = j.y;
  for (let k = 0; k < 60; k++){
    x = B[0] + 60 + Math.random()*(B[2] - B[0] - 150); y = B[1] + 60 + Math.random()*(B[3] - B[1] - 80);
    if (dist(x, y, p.x, p.y) > 100 && (S.purified || dist(x, y, S.zone.x, S.zone.y) > S.zone.r + 30)) break;
  }

}
function updateJelly(dt){
  const j = S.jelly, p = S.player, B = M.bounds;
  j.zapCd = Math.max(0, j.zapCd - dt);
  if (S.riding){
    j.x = p.x; j.y = p.y + 7;
    if (j.zapCd <= 0){
      let best = null, bd = 36 + lvl()*2;
      for (const b of S.germs) if (b.alive){ const d = dist(j.x, j.y + 4, b.x, b.y); if (d < bd){ bd = d; best = b; } }
      if (best){
        j.zapCd = .55; best.hp--; best.stun = Math.max(best.stun, .5);
        const d = bd || 1; best.vx += (best.x - j.x)/d*70; best.vy += (best.y - j.y)/d*70;
        S.zaps.push({x1:j.x, y1:j.y + 5, x2:best.x, y2:best.y, life:.2, off:[0,1,2,3,4].map(() => (Math.random() - .5)*6)});
        if (best.hp <= 0){
          killGerm(best, '#fff6a0'); j.kills++;
          floatText(j.x, j.y - 22, `水母 ${j.kills}/${JELLY_MAX}`, '#bdf0ff');
          if (j.kills >= JELLY_MAX) jellyLeave();
        }
      }
    }
  } else if (j.state === 'leaving'){
    j.fade -= dt/1.2; j.y -= 14*dt;
    if (j.fade <= 0){ j.fade = 0; j.state = 'gone'; j.respawnT = 5; }
  } else if (j.state === 'gone'){
    j.respawnT -= dt; if (j.respawnT <= 0) spawnJelly();
  } else {
    if (j.fade < 1) j.fade = Math.min(1, j.fade + dt/1.2);
    if (dist(j.x, j.y, j.tx, j.ty) < 3){ j.tx = B[0] + 60 + Math.random()*(B[2] - B[0] - 150); j.ty = B[1] + 60 + Math.random()*(B[3] - B[1] - 80); }
    const dx = j.tx - j.x, dy = j.ty - j.y, d = Math.hypot(dx, dy) || 1; j.x += dx/d*8*dt; j.y += dy/d*8*dt;
  }
  for (const z of S.zaps) z.life -= dt;
  S.zaps = S.zaps.filter(z => z.life > 0);
  const c = S.cookie;
  if (!c.alive){ c.respawn -= dt; if (c.respawn <= 0){ c.spot = (c.spot + 1) % M.cookies.length; [c.x, c.y] = M.cookies[c.spot]; c.alive = true; } }
  if (S.eat > 0){
    S.eat -= dt;
    if (Math.random() < dt*6) particles.push({x:p.x + (Math.random() - .5)*6, y:p.y, vx:(Math.random() - .5)*14, vy:10, life:.5, max:.5, c:'#e0a84a', s:1});
    if (S.eat <= 0){ S.eat = 0; S.energy = Math.min(100, S.energy + 20); floatText(p.x, p.y - 20, '+20 能量', '#8ff0a8'); }
  }
}

function update(dt){
  if (menuOpen()) return;
  S.t += dt;
  const p = S.player, B = M.bounds;
  let ix = 0, iy = 0;
  if (keys.has('a') || keys.has('arrowleft')) ix -= 1;

  if (it){ html = tip(it.type === 'algae' ? '微藻' : '氧氣泡', '採集'); at = [it.x, it.y - 9]; }
  else if (!S.over && cookieNear()){ bLab = '吃'; html = tip('黃金飼料', '吃'); at = [S.cookie.x, S.cookie.y - 8]; }
  else if (oi >= 0){ const [x, y] = SC.obs[oi].pos(S.t); bLab = '觀察'; html = tip(SC.obs[oi].name, '觀察'); at = [x, y - 18]; }
  else if (S.riding){ bLab = '下來'; }
  else if (!S.over && jellyNear()){ bLab = '騎乘'; html = tip('水母', '騎乘'); at = [S.jelly.x, S.jelly.y - 11]; }
  else if (!S.over && nearSign()){ bLab = '地圖'; html = tip('海洋地圖', '打開地圖'); at = [M.sign[0], M.sign[1] - 26]; }
  setT($('bE'), bLab);
  if (html){ setHTML(L.prompt, html); L.prompt.style.display = ''; place(L.prompt, at[0], at[1]); } else L.prompt.style.display = 'none';
}
function drawMini(){
  const m = mini, k = 96/480;
  m.drawImage(thumb(CUR), 0, 0);
  if (!S.purified){ m.fillStyle = 'rgba(20,20,30,.85)'; m.beginPath(); m.arc(S.zone.x*k, S.zone.y*k, S.zone.r*k*.8, 0, 7); m.fill(); }
  for (const it of allItems()) if (!it.got){ m.fillStyle = it.type === 'algae' ? '#3fae4a' : '#3aa0e0'; m.fillRect(Math.round(it.x*k) - 1, Math.round(it.y*k) - 1, 2, 2); }
  if (!S.riding && S.jelly.state !== 'gone'){ m.fillStyle = '#eef8ff'; m.fillRect(Math.round(S.jelly.x*k) - 1, Math.round(S.jelly.y*k) - 1, 3, 2); }
  if (S.cookie.alive){ m.fillStyle = '#ffd84a'; m.fillRect(Math.round(S.cookie.x*k) - 1, Math.round(S.cookie.y*k) - 1, 2, 2); }
  for (const b of S.germs) if (b.alive){ m.fillStyle = '#d05cff'; m.fillRect(Math.round(b.x*k) - 1, Math.round(b.y*k) - 1, 2, 2); }
  m.fillStyle = Math.floor(S.t*3) % 2 ? '#ffffff' : '#6cc8ea'; m.fillRect(Math.round(S.player.x*k) - 1, Math.round(S.player.y*k) - 1, 3, 3);
  m.strokeStyle = 'rgba(255,255,255,.6)'; m.lineWidth = 1;
  m.strokeRect(Math.max(0, cam.x*k) + .5, Math.max(0, cam.y*k) + .5, Math.min(96, cv.width*k) - 1, Math.min(60, cv.height*k) - 1);
}

/* ================= 啟動 ================= */
let last = performance.now();
function loop(now){
  const dt = Math.min(.05, (now - last)/1000); last = now;
  update(dt); draw();
  requestAnimationFrame(loop);
}
(async () => {
  resize();
  await loadProgress();
  refreshPortraits();
  enterMap(unlocked(PROG.last) ? PROG.last : 0);
  last = performance.now();
  requestAnimationFrame(loop);
})();
</script>
